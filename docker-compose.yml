# Starry 全栈一键部署编排：PostgreSQL + Redis + 后端 + Agent + 前端(Nginx)
# 用法：
#   cp .env.example .env   # 按需修改 JWT_SECRET 等
#   docker compose up -d --build
# 前端通过 80 端口暴露；后端(8080)与 Agent(3001)仅内部互联。

services:
  postgres:
    # 使用带 pgvector 扩展的 Postgres 镜像，知识库向量检索（<= 算子）依赖该扩展。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-login_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-login_pass_2026}
      POSTGRES_DB: ${DB_NAME:-login_system}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-login_user}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 注入构建版本到 /health 的 version 字段；无 git 信息时回退 dev。
        VERSION: ${VERSION:-dev}
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-login_user}
      DB_PASSWORD: ${DB_PASSWORD:-login_pass_2026}
      DB_NAME: ${DB_NAME:-login_system}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
      DRIVE_DIR: /data/drive
      AGENT_URL: http://agent:3001
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-starry-internal}
      EMBED_URL: http://embed:3002
      APP_ENV: ${APP_ENV:-production}
      # 常规接口的请求体上限；网盘上传/笔记导入会在 handler 内自行抬高额度。
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8388608}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embed:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - drive:/data/drive
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_URL: http://backend:8080
      AGENT_CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-starry-internal}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://apihub.agnes-ai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-agnes-3.0-flash}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # 独立向量化（嵌入）服务：与对话 / Agent 编排服务（agent）解耦。仅承载知识库 RAG 的本地
  # 向量化；HuggingFace 模型下载被网络拦截时只影响知识库入库，绝不会再拖垮对话（502 连环爆）。
  embed:
    build:
      context: ./services/embed
      dockerfile: Dockerfile
    environment:
      PORT: "3002"
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-starry-internal}
      AGENT_CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # HuggingFace 镜像源：受限网络下设置以绕过直连 huggingface.co 失败（如 https://hf-mirror.com）
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      # 模型缓存持久化，避免容器重建后重新下载
      TRANSFORMERS_CACHE: ${TRANSFORMERS_CACHE:-/data/models}
    expose:
      - "3002"
    volumes:
      - models:/data/models
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
  drive:
  models:
