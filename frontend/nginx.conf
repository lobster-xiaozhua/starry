server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 历史路由回退：非资源请求统一交给 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Agent 流式对话（SSE）：最精确匹配，关闭代理缓冲以保证实时推送。
    location = /api/agent/chat {
        proxy_pass http://agent:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 长程任务：创建/运行/列表/详情/取消/进度流全部由 Agent 服务提供。
    # 前缀比 /api/agent/ 更长，nginx 按最长前缀匹配，天然优先。
    location /api/agent/tasks {
        proxy_pass http://agent:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        # 任务进度为 SSE，关闭缓冲以保证实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 其余 /api/agent/* 为后端持久化端点（对话/消息 CRUD、用量）。
    location /api/agent/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # 通用 API 与上传静态资源走后端。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
