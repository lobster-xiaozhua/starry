global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "starry-backend"
    static_configs:
      - targets: ["backend:8080"]
    metrics_path: /metrics

  - job_name: "starry-agent"
    static_configs:
      - targets: ["agent:3001"]
    metrics_path: /metrics

  - job_name: "starry-embed"
    static_configs:
      - targets: ["embed:3002"]
    metrics_path: /metrics
