name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  architecture:
    name: 架构守卫（模块隔离）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 业务模块禁止横向依赖
        run: bash backend/scripts/check-module-isolation.sh

  services:
    name: Node 服务类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: typecheck agent
        run: npm run typecheck --workspace starry-agent
      - name: typecheck embed
        run: npm run typecheck --workspace starry-embed
      - name: test agent
        run: npm test --workspace starry-agent
      - name: test embed
        run: npm test --workspace starry-embed

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install system deps (sharp/libvips)
        run: sudo apt-get update && sudo apt-get install -y libvips-dev build-essential
      - name: npm install (排除 services 下的 Node 服务 workspace)
        # services/agent、services/embed 与前端无关且依赖体积大，从 workspaces 剔除。
        run: |
          sed -i '/"services\//d' package.json
          npm install --no-audit --no-fund
      - name: build frontend
        run: cd frontend && npm run build
