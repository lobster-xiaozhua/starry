name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity:
    name: 配置文件校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # JSON 结构性损坏（Dockerfile/CI 脚本改写配置的副作用）应在秒级暴露，而不是等到构建。
      - name: JSON 可解析
        run: node scripts/check-json.js
      - name: Compose 配置可用
        run: docker compose -f docker-compose.yml config -q

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  architecture:
    name: 架构守卫（模块隔离）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 业务模块禁止横向依赖
        run: bash backend/scripts/check-module-isolation.sh

  services:
    name: Node 服务类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: typecheck agent
        run: npm run typecheck --workspace starry-agent
      - name: typecheck embed
        run: npm run typecheck --workspace starry-embed
      - name: test agent
        run: npm test --workspace starry-agent
      - name: test embed
        run: npm test --workspace starry-embed

  smoke:
    name: 端到端冒烟（compose）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 起栈（postgres + redis + embed + backend）
        env:
          JWT_SECRET: ci-smoke-secret-please-ignore
          ADMIN_PASSWORD: ci-smoke-password
        run: docker compose -f docker-compose.yml -f docker-compose.smoke.yml up -d --build postgres redis embed backend
      - name: 冒烟
        env:
          ADMIN_PASSWORD: ci-smoke-password
        run: bash scripts/smoke.sh
      - name: 收栈
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.smoke.yml down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install system deps (sharp/libvips)
        run: sudo apt-get update && sudo apt-get install -y libvips-dev build-essential
      - name: npm install (排除 services 下的 Node 服务 workspace)
        # services/agent、services/embed 与前端无关且依赖体积大，从 workspaces 剔除。
        # 必须用 Node 改写 JSON：sed 删行会留下尾随逗号，产出非法 JSON（构建期才炸，反馈太晚）。
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.workspaces=(p.workspaces||[]).filter(w=>!w.startsWith('services/'));fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --no-audit --no-fund
      - name: build frontend
        run: cd frontend && npm run build
