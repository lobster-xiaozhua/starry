name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JSON parseable
        run: node scripts/check-json.js
      - name: Compose config valid
        run: docker compose -f docker-compose.yml config -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: golangci-lint
        working-directory: backend
        run: golangci-lint run ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint --workspaces --if-present || true

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.out

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go mod tidy check
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  architecture:
    name: Architecture guard (module isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Business modules must not cross-depend
        run: bash backend/scripts/check-module-isolation.sh

  services:
    name: Node service typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: typecheck agent
        run: npm run typecheck --workspace starry-agent
      - name: typecheck embed
        run: npm run typecheck --workspace starry-embed
      - name: test agent
        run: npm test --workspace starry-agent
      - name: test embed
        run: npm test --workspace starry-embed

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm install (exclude services workspaces)
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.workspaces=(p.workspaces||[]).filter(w=>!w.startsWith('services/'));fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --no-audit --no-fund
      - name: build frontend
        run: cd frontend && npm run build

  smoke:
    name: E2E smoke (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (postgres + redis + embed + backend)
        env:
          JWT_SECRET: ci-smoke-secret-please-ignore
          ADMIN_PASSWORD: ci-smoke-password
        run: docker compose -f docker-compose.yml -f docker-compose.smoke.yml up -d --build postgres redis embed backend
      - name: Smoke test
        env:
          ADMIN_PASSWORD: ci-smoke-password
        run: bash scripts/smoke.sh
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.smoke.yml down -v

  commitlint:
    name: Commit message format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha || github.event.before }} --to HEAD || true
