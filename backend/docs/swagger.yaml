basePath: /api
definitions:
  bootcheck.Check:
    properties:
      count:
        type: integer
      detail:
        type: string
      name:
        type: string
      status:
        description: ok | warn | fail
        type: string
    type: object
  bootcheck.ModuleStatus:
    properties:
      enabled:
        type: boolean
      name:
        type: string
    type: object
  bootcheck.Result:
    properties:
      appEnv:
        type: string
      checks:
        items:
          $ref: '#/definitions/bootcheck.Check'
        type: array
      modules:
        items:
          $ref: '#/definitions/bootcheck.ModuleStatus'
        type: array
      timestamp:
        type: string
      version:
        type: string
    type: object
  console.HealthReport:
    properties:
      boot:
        $ref: '#/definitions/bootcheck.Result'
      db:
        type: boolean
      redis:
        type: boolean
      traffic:
        $ref: '#/definitions/middleware.TrafficSnapshot'
    type: object
  console.SettingsReport:
    properties:
      agentUrl:
        type: string
      appEnv:
        type: string
      driveMaxBytes:
        type: integer
      driveQuotaBytes:
        type: integer
      embedUrl:
        type: string
      maxBodyBytes:
        type: integer
      modules:
        items:
          $ref: '#/definitions/bootcheck.ModuleStatus'
        type: array
    type: object
  middleware.PathSnapshot:
    properties:
      avgLatencyMs:
        type: number
      count:
        type: integer
      errorRate:
        type: number
      path:
        type: string
    type: object
  middleware.StatusSnapshot:
    properties:
      count:
        type: integer
      status:
        type: string
    type: object
  middleware.TrafficSnapshot:
    properties:
      avgLatencyMs:
        type: number
      byPath:
        items:
          $ref: '#/definitions/middleware.PathSnapshot'
        type: array
      byStatus:
        items:
          $ref: '#/definitions/middleware.StatusSnapshot'
        type: array
      errorRate:
        type: number
      startedAt:
        type: string
      totalErrors:
        type: integer
      totalRequests:
        type: integer
      uptimeSeconds:
        type: integer
    type: object
